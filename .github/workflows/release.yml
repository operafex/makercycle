name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validar nome da tag (SemVer)
        shell: bash
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$GITHUB_REF_NAME" =~ $re ]] || { echo "tag inválida: $GITHUB_REF_NAME"; exit 1; }

      - name: Verificar e testar
        run: |
          go vet ./...
          go test -race ./...

      - name: Compilar binários
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            [ "$GOOS" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o "dist/makercycle-${GOOS}-${GOARCH}${ext}" .
          done

      - name: Gerar checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum makercycle-* > checksums.txt

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
